# Homolog — bind host 127.0.0.1:81 (túnel SSH). Upstream via DNS Docker
# (127.0.0.11) com variável para não falhar no start se o DNS ainda aquecer.
#
# IMPORTANTE: com variável em proxy_pass, um URI no proxy_pass (ex.: .../)
# substitui a URI inteira do request — NÃO faz o strip de prefixo como o
# proxy_pass literal. Por isso /api/ usa rewrite + proxy_pass sem path.
# Sem isso, POST /api/auth/login vira POST / na API → HTTP 405.
server {
    listen 80;
    server_name _;

    client_max_body_size 32m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    server_tokens off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # Docker embedded DNS — resolve em runtime (evita emerg "host not found").
    resolver 127.0.0.11 ipv6=off valid=10s;

    location /api/ {
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
    }

    location = /health {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream/health;
    }

    location / {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
    }
}
