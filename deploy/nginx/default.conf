# Produção — upstream via DNS Docker (127.0.0.11) com variável + rewrite.
# Sem resolver, nginx cacheia IP de api/web no startup; após recreate → 502 silencioso.
server {
    listen 80;
    server_name _;

    client_max_body_size 32m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    server_tokens off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    resolver 127.0.0.11 ipv6=off valid=10s;

    location /api/ {
        set $api_upstream api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_pass http://$api_upstream;
    }

    location = /health {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream/health;
    }

    location / {
        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;
    }
}
