name: torqmind-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install API
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: compileall
        run: python -m compileall -q app
      - name: Static unit tests
        run: |
          PYTHONPATH=. python -m unittest \
            app.test_migration_guard_unit \
            app.test_pg_analytical_exceptions_registry \
            app.test_repos_analytics_unit \
            -q

  cdc-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/cdc_consumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CDC consumer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: compileall
        run: python -m compileall -q torqmind_cdc_consumer tests
      - name: Tests
        run: python -m pytest tests -q --tb=short

  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Agent tests
        run: PYTHONPATH=apps/agent python -m unittest discover -s apps/agent/tests -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: npm audit runtime (critical)
        run: npm audit --omit=dev --audit-level=critical

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start ephemeral CI stack
        run: |
          docker compose up -d --build

      - name: Seed users
        run: |
          docker compose exec -T api python -m app.cli.seed

      - name: API smoke tests
        run: |
          make test

      - name: Agent tests
        run: |
          make test-agent

      - name: CDC consumer tests inside repo
        run: |
          make test-cdc-consumer

      - name: Web/API lint-build gate
        run: |
          make lint

      - name: Teardown ephemeral CI volumes only
        if: always()
        run: |
          # GHA runner only. Never copy this command to production or homolog hosts.
          docker compose down -v
