name: torqmind-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install API
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: compileall
        run: python -m compileall -q app
      - name: Static unit tests
        run: |
          PYTHONPATH=. python -m unittest \
            app.test_migration_guard_unit \
            app.test_pg_analytical_exceptions_registry \
            app.test_repos_analytics_unit \
            app.test_ci_ephemeral_stack_contract \
            -q

  cdc-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/cdc_consumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CDC consumer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unixodbc unixodbc-dev
          python -m pip install -e "../api"
      - name: compileall
        run: python -m compileall -q torqmind_cdc_consumer tests
      - name: Tests
        run: python -m pytest tests -q --tb=short

  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/agent/requirements.txt
      - name: Install Agent test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml requests
      - name: Agent tests
        run: PYTHONPATH=apps/agent python -m unittest discover -s apps/agent/tests -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: npm audit runtime (critical)
        run: npm audit --omit=dev --audit-level=critical

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_ENV: test
      COMPOSE_PROJECT_NAME: torqmind-ci
      ENV_FILE: .env.ci
      COMPOSE: docker compose -p torqmind-ci -f docker-compose.ci.yml --env-file .env.ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install hermetic runner deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unixodbc unixodbc-dev
          python -m pip install --upgrade pip
          python -m pip install pyyaml requests
          python -m pip install -e "apps/cdc_consumer[dev]"
          python -m pip install -e apps/api

      - name: Assert ephemeral CI database
        run: bash deploy/scripts/ci-assert-ephemeral-env.sh .env.ci

      - name: Build and start ephemeral CI stack
        run: |
          docker compose -p torqmind-ci -f docker-compose.ci.yml --env-file .env.ci up -d --build
          docker compose -p torqmind-ci -f docker-compose.ci.yml --env-file .env.ci ps

      - name: Wait for Postgres readiness
        run: |
          for i in $(seq 1 60); do
            if docker compose -p torqmind-ci -f docker-compose.ci.yml --env-file .env.ci exec -T postgres \
              pg_isready -U torqmind_ci -d torqmind_ci; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready" >&2
          exit 1

      - name: Bootstrap test schema via migrate
        run: |
          docker compose -p torqmind-ci -f docker-compose.ci.yml --env-file .env.ci \
            exec -T api python -m app.cli.migrate

      - name: Seed users
        run: |
          docker compose -p torqmind-ci -f docker-compose.ci.yml --env-file .env.ci \
            exec -T api python -m app.cli.seed

      - name: API smoke tests
        run: |
          make test

      - name: Agent tests
        run: |
          make test-agent

      - name: CDC consumer tests inside repo
        run: |
          make test-cdc-consumer

      - name: Web/API lint-build gate
        run: |
          make lint

      - name: Collect ephemeral CI logs
        if: failure()
        run: |
          docker compose -p torqmind-ci -f docker-compose.ci.yml --env-file .env.ci ps -a || true
          docker compose -p torqmind-ci -f docker-compose.ci.yml --env-file .env.ci logs --no-color --tail=400 postgres api web clickhouse || true

      - name: Teardown ephemeral CI volumes only
        if: always()
        run: |
          # GHA runner only. Never copy this command to production or homolog hosts.
          docker compose -p torqmind-ci -f docker-compose.ci.yml --env-file .env.ci down -v
