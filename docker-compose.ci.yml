# Ephemeral GitHub Actions stack. Never use on production or homolog hosts.
# No host ports. No initdb mount. Named volumes are project-prefixed and removed by `down -v` on the runner.
name: torqmind-ci

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-torqmind_ci}
      POSTGRES_USER: ${POSTGRES_USER:-torqmind_ci}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CiEphemeralDb_20260814}
    volumes:
      - ci_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-torqmind_ci} -d ${POSTGRES_DB:-torqmind_ci}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-torqmind_mart}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-torqmind}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-CiEphemeralCh_20260814}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ci_chdata:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: ./apps/api
    env_file:
      - ./.env.ci
    environment:
      APP_ENV: test
      TM_EPHEMERAL_LOCAL: "1"
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: ${PG_DATABASE:-torqmind_ci}
      PG_USER: ${PG_USER:-torqmind_ci}
      PG_PASSWORD: ${PG_PASSWORD:-CiEphemeralDb_20260814}
      DATABASE_URL: postgresql+asyncpg://${PG_USER:-torqmind_ci}:${PG_PASSWORD:-CiEphemeralDb_20260814}@postgres:5432/${PG_DATABASE:-torqmind_ci}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-torqmind_mart}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-torqmind}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-CiEphemeralCh_20260814}
      USE_CLICKHOUSE: ${USE_CLICKHOUSE:-true}
      DUAL_READ_MODE: "false"
      USE_REALTIME_MARTS: "false"
      REALTIME_MARTS_SOURCE: stg
      REALTIME_MARTS_FALLBACK: "false"
    volumes:
      - ./sql/migrations:/app/sql/migrations:ro
      - ./sql/ci:/app/sql/ci:ro
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: /api
    depends_on:
      - api

volumes:
  ci_pgdata:
  ci_chdata:
