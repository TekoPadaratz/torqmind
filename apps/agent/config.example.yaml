# TorqMind Extractor Agent config (SAFE EXAMPLE - no secrets)
#
# ====================================================================
# COMO ATUALIZAR O AGENT NO CLIENTE (fluxo recomendado, seguro)
# --------------------------------------------------------------------
# 1) O MAPEAMENTO DAS TABELAS JA VEM EMBUTIDO no binario (agent/config.py).
#    Ao gerar um novo torqmind-agent.exe, as tabelas novas passam a coletar
#    SOZINHAS. Voce NAO precisa copiar a secao `datasets:` para o cliente.
# 2) No cliente, use um config CRIPTOGRAFADO (config.enc), nunca .yaml em texto:
#      torqmind-agent.exe config init --interactive --config config.enc
#    (ou `config edit`/update-config.bat). O config.enc e cifrado com o Windows
#    DPAPI (amarrado a maquina) — nao abre no Notepad, nao expoe senha/ingest_key.
# 3) O config.enc do cliente so precisa de: conexao SQL + api.ingest_key +
#    id_empresa. Ele NAO tem senhas em texto e NAO precisa do mapeamento.
# 4) Para atualizar so a versao: substitua o .exe e reinicie o servico. O
#    config.enc permanece intacto (conexao preservada) e as tabelas novas
#    coletam automaticamente.
# 5) Migrar um cliente antigo (config.yaml em texto) para o modo seguro.
#    SEMPRE passe --config config.enc (mesmo nome que o servico WinSW espera em
#    torqmind-agent-service.xml). Sem --config, o alvo vira config.local.enc e o
#    servico nao acha. O comando JA APAGA o config.yaml de origem, entao faca uma
#    copia de seguranca ANTES:
#      copy config.yaml config.yaml.bak
#      torqmind-agent.exe config migrate-from-yaml --source config.yaml --config config.enc
#      torqmind-agent.exe config show-safe --config config.enc   (confirma que gravou)
#    Se o servico antigo ainda aponta para --config config.yaml, ajuste o
#    torqmind-agent-service.xml para --config config.enc (ou apenas suba o .exe
#    novo, que ja acha config.enc/config.local.enc sozinho) e reinicie o servico.
#
# 6) Dims full_refresh: throttle default 1800s entre syncs completos
#    (phase=full_refresh_throttled) para reduzir wear de SSD no SQL Server do posto.
#
# A secao `datasets:` abaixo e apenas REFERENCIA/documentacao do que o agent
# coleta — a fonte da verdade e agent/config.py (embutido no .exe).
# ====================================================================

sqlserver:
  driver: ODBC Driver 17 for SQL Server
  server: "tcp:CENTRALVR"
  port: 1433
  database: ATXDADOS
  user: sa
  password: "CHANGE_ME"
  encrypt: false
  trust_server_certificate: true
  login_timeout_seconds: 20
  query_timeout_seconds: 600  # evita hang eterno no SQL Server

api:
  # Public base URL. The agent auto-detects the real API root behind nginx (/api).
  base_url: http://177.70.206.90:14023
  route_prefix: auto
  # Production key expected by the published API. It must be a valid UUID.
  ingest_key: "CHANGE_ME_UUID"
  # Legacy/dev fallback only. The published production endpoint still requires X-Ingest-Key.
  empresa_id: 1

id_empresa: 1
id_db: 1

runtime:
  batch_size: 2000
  fetch_size: 1000
  max_retries: 5
  timeout_seconds: 30
  connect_timeout_seconds: 10
  read_timeout_seconds: 60
  retry_backoff_base_seconds: 1.0
  retry_backoff_max_seconds: 30.0
  retry_jitter_seconds: 0.0
  batch_delay_seconds: 0.75
  gzip_enabled: true
  state_dir: state
  spool_dir: spool
  spool_flush_max_files: 200
  interval_seconds: 60
  summary_log_file: logs/torqmind-agent-summary.txt
  log_file: logs/torqmind-agent.log
  log_level: INFO
  revisit_max_rows: 5000
  auto_update: true
  update_check_cycles: 30
  rescan_hourly_window_hours: 2    # de hora em hora, re-extrai últimas 2h
  rescan_daily_window_days: 7      # diário, re-extrai últimos 7 dias
  rescan_daily_after_hour: 0       # dispara na primeira execução após meia-noite

datasets:
  filiais:
    enabled: false
    table: dbo.FILIAIS
    watermark_column: ID_FILIAL
    watermark_order_by: ID_FILIAL
    full_refresh: true
  funcionarios:
    enabled: true
    table: dbo.FUNCIONARIOS
    watermark_column: ID_FUNCIONARIOS
    watermark_order_by: ID_FUNCIONARIOS, ID_FILIAL
    full_refresh: true
  usuarios:
    enabled: true
    table: dbo.USUARIOS
    watermark_column: ID_USUARIOS
    watermark_order_by: ID_USUARIOS, ID_FILIAL
    full_refresh: true
  entidades:
    enabled: true
    table: dbo.ENTIDADES
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_WATERMARK
    watermark_overlap_seconds: 240
    query: SELECT e.*, (SELECT MAX(v.dt) FROM (VALUES   (NULLIF(CAST(e.DATAREPL AS datetime2), CAST('19000101' AS datetime2))),   (CAST(e.ULTALTERACAO
      AS datetime2)),   (CAST(e.DTACADASTRO AS datetime2))) AS v(dt)) AS TORQMIND_WATERMARK FROM dbo.ENTIDADES e
  clientes:
    enabled: false
    table: dbo.ENTIDADES
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_WATERMARK
    watermark_overlap_seconds: 240
    query: SELECT e.*, (SELECT MAX(v.dt) FROM (VALUES   (NULLIF(CAST(e.DATAREPL AS datetime2), CAST('19000101' AS datetime2))),   (CAST(e.ULTALTERACAO
      AS datetime2)),   (CAST(e.DTACADASTRO AS datetime2))) AS v(dt)) AS TORQMIND_WATERMARK FROM dbo.ENTIDADES e
  grupoprodutos:
    enabled: true
    table: dbo.GRUPOPRODUTOS
    watermark_column: ID_GRUPOPRODUTOS
    watermark_order_by: ID_GRUPOPRODUTOS, ID_FILIAL
    full_refresh: true
  planodecontas:
    enabled: true
    table: dbo.PLANODECONTAS
    watermark_column: ID_PLANODECONTAS
    watermark_order_by: ID_PLANODECONTAS, ID_FILIAL
    full_refresh: true
  localvendas:
    enabled: false
    table: dbo.LOCALVENDAS
    watermark_column: ID_LOCALVENDAS
    watermark_order_by: ID_LOCALVENDAS, ID_FILIAL
    full_refresh: true
  produtos:
    enabled: true
    table: dbo.PRODUTOS
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_WATERMARK
    watermark_overlap_seconds: 240
    query: SELECT p.*, COALESCE(CAST(p.ULTALTERACAO AS datetime2), CAST(p.DATACADASTRO AS datetime2)) AS TORQMIND_WATERMARK
      FROM dbo.PRODUTOS p
  turnos:
    enabled: true
    table: dbo.TURNOS
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_order_by: TORQMIND_WATERMARK, ID_FILIAL, ID_TURNOS
    allow_zero_inserted_batches: true
    contract_name: turnos_pk
    required_fields:
    - ID_TURNOS
    - ID_FILIAL
    unique_key_fields:
    - ID_TURNOS
    - ID_FILIAL
    preflight_tables:
      dbo.TURNOS:
      - ID_TURNOS
      - ID_FILIAL
      - DATA
      - DATATURNO
      - DATAFECHAMENTO
      - ENCERRANTEFECHAMENTO
      - STATUSTURNO
    watermark_overlap_seconds: 240
    # STATUSTURNO=0 = aberto; janela 45d cobre 1ª entrega perdida (watermark já avançou).
    # ENCERRANTEFECHAMENTO é encerrante de bomba, NÃO flag de fechamento.
    # Rede de segurança server-side: deploy/scripts/prod-reconcile-turnos.sh (cron).
    revisit_open_clause: (ISNULL(STATUSTURNO, 0) = 0) OR (CAST(DATA AS date) >= CAST(DATEADD(day,-45,GETDATE())
      AS date)) OR (DATAFECHAMENTO IS NOT NULL AND CAST(DATAFECHAMENTO AS date) >= CAST(DATEADD(day,-45,GETDATE()) AS date))
    query: SELECT t.*, CAST(t.DATA AS datetime2) AS TORQMIND_DT_EVENTO, (SELECT MAX(v.dt)    FROM (VALUES        (CAST(t.DATA
      AS datetime2)),        (CAST(t.DATATURNO AS datetime2)),        (CAST(t.DATAFECHAMENTO AS datetime2))   ) AS v(dt))
      AS TORQMIND_WATERMARK FROM dbo.TURNOS t
  comprovantes:
    enabled: true
    table: dbo.COMPROVANTES
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_order_by: TORQMIND_WATERMARK, ID_COMPROVANTE, ID_FILIAL, ID_DB
    cursor_pk_columns:
    - ID_COMPROVANTE
    - ID_FILIAL
    - ID_DB
    contract_name: comprovantes_pk_required_fields
    required_fields:
    - ID_COMPROVANTE
    - ID_FILIAL
    - ID_DB
    - SITUACAO
    unique_key_fields:
    - ID_COMPROVANTE
    - ID_FILIAL
    - ID_DB
    preflight_tables:
      dbo.COMPROVANTES:
      - ID_COMPROVANTE
      - ID_FILIAL
      - ID_DB
      - DATA
      - DATAREPL
      - SITUACAO
    retention_days: 365
    bootstrap_days: 365
    watermark_overlap_seconds: 240
    query: SELECT c.*, CAST(c.DATA AS datetime2) AS TORQMIND_DT_EVENTO, (SELECT MAX(v.dt)    FROM (VALUES        (CAST(c.DATA
      AS datetime2)),        (NULLIF(CAST(c.DATAREPL AS datetime2), CAST('1900-01-01T00:00:00' AS datetime2)))   ) AS v(dt))
      AS TORQMIND_WATERMARK FROM dbo.COMPROVANTES c
  itenscomprovantes:
    enabled: true
    table: dbo.ITENSCOMPROVANTE
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_order_by: TORQMIND_WATERMARK, ID_FILIAL, ID_ITENSCOMPROVANTE, ID_DB
    cursor_pk_columns:
    - ID_FILIAL
    - ID_ITENSCOMPROVANTE
    - ID_DB
    contract_name: itenscomprovantes_pk_parent
    required_fields:
    - ID_ITENSCOMPROVANTE
    - ID_ITEMCOMPROVANTE
    - ID_FILIAL
    - ID_DB
    - ID_COMPROVANTE
    unique_key_fields:
    - ID_FILIAL
    - ID_ITENSCOMPROVANTE
    - ID_DB
    row_aliases:
      ID_ITEMCOMPROVANTE: ID_ITENSCOMPROVANTE
    preflight_tables:
      dbo.ITENSCOMPROVANTE:
      - ID_ITENSCOMPROVANTE
      - ID_FILIAL
      - ID_DB
      - ID_COMPROVANTE
      - DATAREPL
      dbo.COMPROVANTES:
      - ID_COMPROVANTE
      - ID_FILIAL
      - ID_DB
      - DATA
    retention_days: 365
    bootstrap_days: 365
    watermark_overlap_seconds: 240
    query: SELECT i.*, CAST(c.DATA AS datetime2) AS TORQMIND_DT_EVENTO, (SELECT MAX(v.dt)    FROM (VALUES        (CAST(c.DATA
      AS datetime2)),        (NULLIF(CAST(i.DATAREPL AS datetime2), CAST('1900-01-01T00:00:00' AS datetime2)))   ) AS v(dt))
      AS TORQMIND_WATERMARK FROM dbo.ITENSCOMPROVANTE i JOIN dbo.COMPROVANTES c   ON c.ID_COMPROVANTE = i.ID_COMPROVANTE  AND
      c.ID_FILIAL = i.ID_FILIAL  AND c.ID_DB = i.ID_DB
  movprodutos:
    enabled: true
    table: dbo.MOVPRODUTOS
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_order_by: TORQMIND_WATERMARK, ID_MOVPRODUTOS, ID_FILIAL, ID_DB
    cursor_pk_columns:
    - ID_MOVPRODUTOS
    - ID_FILIAL
    - ID_DB
    retention_days: 560
    bootstrap_days: 560
    watermark_overlap_seconds: 240
    query: SELECT m.*, CAST(m.DATA AS datetime2) AS TORQMIND_DT_EVENTO, (SELECT MAX(v.dt)    FROM (VALUES        (CAST(m.DATA
      AS datetime2)),        (NULLIF(CAST(m.DATAREPL AS datetime2), CAST('1900-01-01T00:00:00' AS datetime2)))   ) AS v(dt))
      AS TORQMIND_WATERMARK FROM dbo.MOVPRODUTOS m
    deprecated: false
    deprecation_notice: Not canonical for sales (use comprovantes). Enabled for Solvencia stock reconstruction (movimentacao
      de estoque).
  itensmovprodutos:
    enabled: true
    table: dbo.ITENSMOVPRODUTOS
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_order_by: TORQMIND_WATERMARK, ID_ITENSMOVPRODUTOS, ID_FILIAL, ID_DB
    cursor_pk_columns:
    - ID_ITENSMOVPRODUTOS
    - ID_FILIAL
    - ID_DB
    retention_days: 560
    bootstrap_days: 560
    watermark_overlap_seconds: 240
    query: SELECT i.*, CAST(m.DATA AS datetime2) AS TORQMIND_DT_EVENTO, (SELECT MAX(v.dt)    FROM (VALUES        (CAST(m.DATA
      AS datetime2)),        (NULLIF(CAST(i.DATAREPL AS datetime2), CAST('1900-01-01T00:00:00' AS datetime2)))   ) AS v(dt))
      AS TORQMIND_WATERMARK FROM dbo.ITENSMOVPRODUTOS i JOIN dbo.MOVPRODUTOS m   ON m.ID_MOVPRODUTOS = i.ID_MOVPRODUTOS  AND
      m.ID_FILIAL = i.ID_FILIAL  AND m.ID_DB = i.ID_DB
    deprecated: false
    deprecation_notice: Not canonical for sales items (use itenscomprovantes). Enabled for Solvencia stock cost (VLRCUSTOCOMICMS).
  formas_pgto_comprovantes:
    enabled: true
    table: dbo.FORMAS_PGTO_COMPROVANTES
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_order_by: TORQMIND_WATERMARK, ID_FILIAL, ID_FORMAS_PGTO_COMPROVANTES, ID_DB
    cursor_pk_columns:
    - ID_FILIAL
    - ID_FORMAS_PGTO_COMPROVANTES
    - ID_DB
    contract_name: formas_pgto_comprovantes_pk
    required_fields:
    - ID_FORMAS_PGTO_COMPROVANTES
    - ID_FILIAL
    - ID_DB
    - ID_REFERENCIA
    unique_key_fields:
    - ID_FILIAL
    - ID_FORMAS_PGTO_COMPROVANTES
    - ID_DB
    preflight_tables:
      dbo.FORMAS_PGTO_COMPROVANTES:
      - ID_FORMAS_PGTO_COMPROVANTES
      - ID_FILIAL
      - ID_DB
      - ID_REFERENCIA
      - DATAREPL
      dbo.COMPROVANTES:
      - ID_COMPROVANTE
      - ID_FILIAL
      - ID_DB
      - REFERENCIA
      - DATA
    retention_days: 365
    bootstrap_days: 365
    watermark_overlap_seconds: 240
    query: SELECT f.*, CAST(c.DATA AS datetime2) AS TORQMIND_DT_EVENTO, (SELECT MAX(v.dt)    FROM (VALUES        (CAST(c.DATA
      AS datetime2)),        (NULLIF(CAST(f.DATAREPL AS datetime2), CAST('1900-01-01T00:00:00' AS datetime2)))   ) AS v(dt))
      AS TORQMIND_WATERMARK FROM dbo.COMPROVANTES c INNER JOIN dbo.FORMAS_PGTO_COMPROVANTES f   ON f.ID_FILIAL = c.ID_FILIAL  AND
      f.ID_DB = c.ID_DB  AND CASE WHEN NULLIF(LTRIM(RTRIM(CONVERT(varchar(64), f.ID_REFERENCIA))), '') IS NULL THEN NULL WHEN LTRIM(RTRIM(CONVERT(varchar(64), f.ID_REFERENCIA))) LIKE '%[^0-9]%' THEN NULL ELSE CONVERT(int, LTRIM(RTRIM(CONVERT(varchar(64), f.ID_REFERENCIA)))) END = c.REFERENCIA
  contaspagar:
    enabled: true
    table: dbo.CONTASPAGAR
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_overlap_seconds: 240
    bootstrap_days: 365
    revisit_open_clause: (DTAPGTO IS NULL AND CAST(DTACONTA AS date) >= CAST(DATEADD(day,-120,GETDATE()) AS date)) OR (DTAPGTO
      IS NOT NULL AND CAST(DTAPGTO AS date) >= CAST(DATEADD(day,-120,GETDATE()) AS date)) OR (CAST(DTAVCTO AS date) >= CAST(DATEADD(day,-120,GETDATE())
      AS date))
    query: SELECT c.*, CAST(c.DTACONTA AS datetime2) AS TORQMIND_DT_EVENTO, (SELECT MAX(v.dt) FROM (VALUES (CAST(c.DTACONTA
      AS datetime2)), (NULLIF(CAST(c.DATAREPL AS datetime2), CAST('1900-01-01T00:00:00' AS datetime2)))) AS v(dt)) AS TORQMIND_WATERMARK
      FROM dbo.CONTASPAGAR c
  contasreceber:
    enabled: true
    table: dbo.CONTASRECEBER
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_overlap_seconds: 240
    bootstrap_days: 365
    revisit_open_clause: (DTAPGTO IS NULL AND CAST(DTACONTA AS date) >= CAST(DATEADD(day,-90,GETDATE()) AS date)) OR (DTAPGTO
      IS NOT NULL AND CAST(DTAPGTO AS date) >= CAST(DATEADD(day,-120,GETDATE()) AS date))
    query: SELECT c.*, CAST(c.DTACONTA AS datetime2) AS TORQMIND_DT_EVENTO, (SELECT MAX(v.dt) FROM (VALUES (CAST(c.DTACONTA
      AS datetime2)), (NULLIF(CAST(c.DATAREPL AS datetime2), CAST('1900-01-01T00:00:00' AS datetime2)))) AS v(dt)) AS TORQMIND_WATERMARK
      FROM dbo.CONTASRECEBER c
  contasreceberbaixa:
    enabled: true
    table: dbo.CONTASRECEBERBAIXA
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_overlap_seconds: 240
    bootstrap_days: 365
    query: SELECT c.*, CAST(c.DATABAIXA AS datetime2) AS TORQMIND_DT_EVENTO, (SELECT MAX(v.dt) FROM (VALUES (CAST(c.DATABAIXA
      AS datetime2)), (NULLIF(CAST(c.DATAREPL AS datetime2), CAST('1900-01-01T00:00:00' AS datetime2)))) AS v(dt)) AS TORQMIND_WATERMARK
      FROM dbo.CONTASRECEBERBAIXA c
  contaspagarbaixa:
    enabled: true
    table: dbo.CONTASPAGARBAIXA
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_overlap_seconds: 240
    bootstrap_days: 365
    query: SELECT c.*, CAST(c.DATABAIXA AS datetime2) AS TORQMIND_DT_EVENTO, (SELECT MAX(v.dt) FROM (VALUES (CAST(c.DATABAIXA
      AS datetime2)), (NULLIF(CAST(c.DATAREPL AS datetime2), CAST('1900-01-01T00:00:00' AS datetime2)))) AS v(dt)) AS TORQMIND_WATERMARK
      FROM dbo.CONTASPAGARBAIXA c
  movlctos:
    enabled: true
    table: dbo.MOVLCTOS
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_overlap_seconds: 240
    bootstrap_days: 365
    revisit_open_clause: CAST(DTACONTA AS date) >= CAST(DATEADD(day,-120,GETDATE()) AS date) OR UPPER(LTRIM(RTRIM(DOCUMENTO)))
      LIKE 'TRANSF AJUSTE%' OR UPPER(LTRIM(RTRIM(DOCUMENTO))) LIKE 'AJUSTE-SALDO%' OR UPPER(LTRIM(RTRIM(DOCUMENTO))) LIKE
      'AJUSTE SALDO%' OR UPPER(LTRIM(RTRIM(DOCUMENTO))) LIKE 'AJUSTE DE SALDOS%' OR UPPER(LTRIM(RTRIM(DOCUMENTO))) LIKE 'AJUSTE
      EMPRESTIMO%'
    query: SELECT m.*, CAST(m.DTACONTA AS datetime2) AS TORQMIND_DT_EVENTO, (SELECT MAX(v.dt) FROM (VALUES (CAST(m.DTACONTA
      AS datetime2)), (CAST(m.DATA AS datetime2)), (NULLIF(CAST(m.DATAREPL AS datetime2), CAST('1900-01-01T00:00:00' AS datetime2))))
      AS v(dt)) AS TORQMIND_WATERMARK FROM dbo.MOVLCTOS m
  movbancos_ajuste_plano:
    enabled: true
    table: dbo.MOVLCTOS
    watermark_column: ID_MOVLCTOS
    watermark_order_by: ID_MOVLCTOS, ID_FILIAL, ID_DB
    cursor_pk_columns:
    - ID_MOVLCTOS
    - ID_FILIAL
    - ID_DB
    full_refresh: true
    query: SELECT m.*, CAST(m.DTACONTA AS datetime2) AS TORQMIND_DT_EVENTO, (SELECT MAX(v.dt) FROM (VALUES (CAST(m.DTACONTA
      AS datetime2)), (CAST(m.DATA AS datetime2)), (NULLIF(CAST(m.DATAREPL AS datetime2), CAST('1900-01-01T00:00:00' AS datetime2))))
      AS v(dt)) AS TORQMIND_WATERMARK FROM dbo.MOVLCTOS m WHERE ISNULL(m.ESTORNO, 0) = 0 AND ( UPPER(LTRIM(RTRIM(m.DOCUMENTO)))
      LIKE 'TRANSF AJUSTE%' OR UPPER(LTRIM(RTRIM(m.DOCUMENTO))) LIKE 'AJUSTE-SALDO%' OR UPPER(LTRIM(RTRIM(m.DOCUMENTO))) LIKE
      'AJUSTE SALDO%' OR UPPER(LTRIM(RTRIM(m.DOCUMENTO))) LIKE 'AJUSTE DE SALDOS%' OR UPPER(LTRIM(RTRIM(m.DOCUMENTO))) LIKE
      'AJUSTE EMPRESTIMO%')
  financeiro:
    enabled: false
    table: dbo.FINANCEIRO
  cheques:
    enabled: true
    table: dbo.CHEQUESRECEBIDOS
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_overlap_seconds: 240
    bootstrap_days: 365
    revisit_open_clause: (DTACOMPENSADO IS NULL AND CAST(DTACONTA AS date) >= CAST(DATEADD(day,-180,GETDATE()) AS date)) OR
      (DTACOMPENSADO IS NOT NULL AND CAST(DTACOMPENSADO AS date) >= CAST(DATEADD(day,-120,GETDATE()) AS date))
    query: SELECT c.*, CAST(c.DTACONTA AS datetime2) AS TORQMIND_DT_EVENTO, (SELECT MAX(v.dt) FROM (VALUES (CAST(c.DTACONTA
      AS datetime2)), (NULLIF(CAST(c.DATAREPL AS datetime2), CAST('1900-01-01T00:00:00' AS datetime2))), (CAST(c.DTACOMPENSADO
      AS datetime2))) AS v(dt)) AS TORQMIND_WATERMARK FROM dbo.CHEQUESRECEBIDOS c
  situacoes:
    enabled: true
    table: dbo.SITUACOES
    watermark_column: ID_SITUACOES
    watermark_order_by: ID_SITUACOES, ID_FILIAL
    full_refresh: true
  movcreditoentidades:
    enabled: true
    table: dbo.MOVCREDITOENTIDADES
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_overlap_seconds: 240
    bootstrap_days: 365
    query: SELECT m.*, CAST(m.DATA AS datetime2) AS TORQMIND_DT_EVENTO, (SELECT MAX(v.dt) FROM (VALUES (CAST(m.DATA AS datetime2)),
      (NULLIF(CAST(m.DATAREPL AS datetime2), CAST('1900-01-01T00:00:00' AS datetime2)))) AS v(dt)) AS TORQMIND_WATERMARK FROM
      dbo.MOVCREDITOENTIDADES m
  credito:
    enabled: true
    table: dbo.CREDITO
    watermark_column: ID_CREDITO
    watermark_order_by: ID_CREDITO, ID_FILIAL
    full_refresh: true
  consolearquivo:
    enabled: true
    table: dbo.CONSOLEARQUIVO
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_overlap_seconds: 240
    bootstrap_days: 365
    query: SELECT c.*, CAST(c.DATA AS datetime2) AS TORQMIND_DT_EVENTO, (SELECT MAX(v.dt) FROM (VALUES (CAST(c.DATA AS datetime2)),
      (NULLIF(CAST(c.DATAREPL AS datetime2), CAST('1900-01-01T00:00:00' AS datetime2)))) AS v(dt)) AS TORQMIND_WATERMARK FROM
      dbo.CONSOLEARQUIVO c
  nfe:
    enabled: true
