# TorqMind Extractor Agent config (SAFE EXAMPLE - no secrets)
#
# ====================================================================
# COMO ATUALIZAR O AGENT NO CLIENTE (fluxo recomendado, seguro)
# --------------------------------------------------------------------
# 1) O MAPEAMENTO DAS TABELAS JA VEM EMBUTIDO no binario (agent/config.py).
#    Ao gerar um novo torqmind-agent.exe, as tabelas novas passam a coletar
#    SOZINHAS. Voce NAO precisa copiar a secao `datasets:` para o cliente.
# 2) No cliente, use um config CRIPTOGRAFADO (config.enc), nunca .yaml em texto:
#      torqmind-agent.exe config init --interactive --config config.enc
#    (ou `config edit`/update-config.bat). O config.enc e cifrado com o Windows
#    DPAPI (amarrado a maquina) — nao abre no Notepad, nao expoe senha/ingest_key.
# 3) O config.enc do cliente so precisa de: conexao SQL + api.ingest_key +
#    id_empresa. Ele NAO tem senhas em texto e NAO precisa do mapeamento.
# 4) Para atualizar so a versao: substitua o .exe e reinicie o servico. O
#    config.enc permanece intacto (conexao preservada) e as tabelas novas
#    coletam automaticamente.
# 5) Migrar um cliente antigo (config.yaml em texto) para o modo seguro.
#    SEMPRE passe --config config.enc (mesmo nome que o servico WinSW espera em
#    torqmind-agent-service.xml). Sem --config, o alvo vira config.local.enc e o
#    servico nao acha. O comando JA APAGA o config.yaml de origem, entao faca uma
#    copia de seguranca ANTES:
#      copy config.yaml config.yaml.bak
#      torqmind-agent.exe config migrate-from-yaml --source config.yaml --config config.enc
#      torqmind-agent.exe config show-safe --config config.enc   (confirma que gravou)
#    Se o servico antigo ainda aponta para --config config.yaml, ajuste o
#    torqmind-agent-service.xml para --config config.enc (ou apenas suba o .exe
#    novo, que ja acha config.enc/config.local.enc sozinho) e reinicie o servico.
#
# A secao `datasets:` abaixo e apenas REFERENCIA/documentacao do que o agent
# coleta — a fonte da verdade e agent/config.py (embutido no .exe).
# ====================================================================

sqlserver:
  driver: ODBC Driver 17 for SQL Server
  server: "tcp:CENTRALVR"
  port: 1433
  database: ATXDADOS
  user: sa
  password: "CHANGE_ME"
  encrypt: false
  trust_server_certificate: true
  login_timeout_seconds: 20

api:
  # Public base URL. The agent auto-detects the real API root behind nginx (/api).
  base_url: http://177.70.206.90:14023
  route_prefix: auto
  # Production key expected by the published API. It must be a valid UUID.
  ingest_key: "CHANGE_ME_UUID"
  # Legacy/dev fallback only. The published production endpoint still requires X-Ingest-Key.
  empresa_id: 1

id_empresa: 1
id_db: 1

runtime:
  batch_size: 5000
  fetch_size: 2000
  max_retries: 5
  timeout_seconds: 30
  connect_timeout_seconds: 10
  read_timeout_seconds: 60
  retry_backoff_base_seconds: 1.0
  retry_backoff_max_seconds: 30.0
  retry_jitter_seconds: 0.0
  gzip_enabled: true
  state_dir: state
  spool_dir: spool
  spool_flush_max_files: 200
  interval_seconds: 60
  summary_log_file: logs/torqmind-agent-summary.txt
  log_level: INFO
  rescan_hourly_window_hours: 2    # de hora em hora, re-extrai últimas 2h
  rescan_daily_window_days: 7      # diário, re-extrai últimos 7 dias
  rescan_daily_after_hour: 0       # dispara na primeira execução após meia-noite

datasets:
  comprovantes:
    enabled: true
    table: dbo.COMPROVANTES
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_order_by: TORQMIND_WATERMARK, ID_COMPROVANTE, ID_FILIAL, ID_DB
    cursor_pk_columns: [ID_COMPROVANTE, ID_FILIAL, ID_DB]
    retention_days: 365
    bootstrap_days: 365
    watermark_overlap_seconds: 120
    query: |
      SELECT c.*,
             CAST(c.DATA AS datetime2) AS TORQMIND_DT_EVENTO,
             (SELECT MAX(v.dt)
                FROM (VALUES
                    (CAST(c.DATA AS datetime2)),
                    (NULLIF(CAST(c.DATAREPL AS datetime2), CAST('1900-01-01T00:00:00' AS datetime2)))
                ) AS v(dt)) AS TORQMIND_WATERMARK
      FROM dbo.COMPROVANTES c

  itenscomprovantes:
    enabled: true
    table: dbo.ITENSCOMPROVANTE
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_order_by: TORQMIND_WATERMARK, ID_FILIAL, ID_ITENSCOMPROVANTE, ID_DB
    cursor_pk_columns: [ID_FILIAL, ID_ITENSCOMPROVANTE, ID_DB]
    row_aliases:
      ID_ITEMCOMPROVANTE: ID_ITENSCOMPROVANTE
    retention_days: 365
    bootstrap_days: 365
    watermark_overlap_seconds: 120
    query: |
      SELECT i.*,
             CAST(c.DATA AS datetime2) AS TORQMIND_DT_EVENTO,
             (SELECT MAX(v.dt)
                FROM (VALUES
                    (CAST(c.DATA AS datetime2)),
                    (NULLIF(CAST(i.DATAREPL AS datetime2), CAST('1900-01-01T00:00:00' AS datetime2)))
                ) AS v(dt)) AS TORQMIND_WATERMARK
      FROM dbo.ITENSCOMPROVANTE i
      JOIN dbo.COMPROVANTES c
        ON c.ID_COMPROVANTE = i.ID_COMPROVANTE
       AND c.ID_FILIAL = i.ID_FILIAL
       AND c.ID_DB = i.ID_DB

  movprodutos:
    enabled: false
    # Dataset legado descontinuado na arquitetura ativa.
    # Preserve apenas para compatibilidade excepcional.
    table: dbo.MOVPRODUTOS
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_order_by: TORQMIND_WATERMARK, ID_MOVPRODUTOS, ID_FILIAL, ID_DB
    cursor_pk_columns: [ID_MOVPRODUTOS, ID_FILIAL, ID_DB]
    retention_days: 365
    bootstrap_days: 365
    watermark_overlap_seconds: 120
    query: |
      SELECT m.*,
             CAST(m.DATA AS datetime2) AS TORQMIND_DT_EVENTO,
             (SELECT MAX(v.dt)
                FROM (VALUES
                    (CAST(m.DATA AS datetime2)),
                    (NULLIF(CAST(m.DATAREPL AS datetime2), CAST('1900-01-01T00:00:00' AS datetime2)))
                ) AS v(dt)) AS TORQMIND_WATERMARK
      FROM dbo.MOVPRODUTOS m

  itensmovprodutos:
    enabled: false
    # Dataset legado descontinuado na arquitetura ativa.
    # Preserve apenas para compatibilidade excepcional.
    table: dbo.ITENSMOVPRODUTOS
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_order_by: TORQMIND_WATERMARK, ID_ITENSMOVPRODUTOS, ID_FILIAL, ID_DB
    cursor_pk_columns: [ID_ITENSMOVPRODUTOS, ID_FILIAL, ID_DB]
    retention_days: 365
    bootstrap_days: 365
    watermark_overlap_seconds: 120
    query: |
      SELECT i.*,
             CAST(m.DATA AS datetime2) AS TORQMIND_DT_EVENTO,
             (SELECT MAX(v.dt)
                FROM (VALUES
                    (CAST(m.DATA AS datetime2)),
                    (NULLIF(CAST(i.DATAREPL AS datetime2), CAST('1900-01-01T00:00:00' AS datetime2)))
                ) AS v(dt)) AS TORQMIND_WATERMARK
      FROM dbo.ITENSMOVPRODUTOS i
      JOIN dbo.MOVPRODUTOS m
        ON m.ID_MOVPRODUTOS = i.ID_MOVPRODUTOS
       AND m.ID_FILIAL = i.ID_FILIAL
       AND m.ID_DB = i.ID_DB

  formas_pgto_comprovantes:
    enabled: true
    table: dbo.FORMAS_PGTO_COMPROVANTES
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_order_by: TORQMIND_WATERMARK, ID_FILIAL, ID_FORMAS_PGTO_COMPROVANTES, ID_DB
    cursor_pk_columns: [ID_FILIAL, ID_FORMAS_PGTO_COMPROVANTES, ID_DB]
    retention_days: 365
    bootstrap_days: 365
    watermark_overlap_seconds: 120
    query: |
      SELECT f.*,
             CAST(c.DATA AS datetime2) AS TORQMIND_DT_EVENTO,
             (SELECT MAX(v.dt)
                FROM (VALUES
                    (CAST(c.DATA AS datetime2)),
                    (NULLIF(CAST(f.DATAREPL AS datetime2), CAST('1900-01-01T00:00:00' AS datetime2)))
                ) AS v(dt)) AS TORQMIND_WATERMARK
      FROM dbo.FORMAS_PGTO_COMPROVANTES f
      JOIN dbo.COMPROVANTES c
        ON c.REFERENCIA = CASE
             WHEN NULLIF(LTRIM(RTRIM(CAST(f.ID_REFERENCIA AS varchar(64)))), '') IS NOT NULL
              AND LTRIM(RTRIM(CAST(f.ID_REFERENCIA AS varchar(64)))) NOT LIKE '%[^0-9]%'
             THEN CAST(LTRIM(RTRIM(CAST(f.ID_REFERENCIA AS varchar(64)))) AS int)
             ELSE NULL
           END
       AND c.ID_FILIAL = f.ID_FILIAL
       AND c.ID_DB = f.ID_DB

  filiais:
    enabled: true
    table: dbo.FILIAIS
    watermark_column: ID_FILIAL
    watermark_order_by: ID_FILIAL
    full_refresh: true

  funcionarios:
    enabled: true
    table: dbo.FUNCIONARIOS
    watermark_column: ID_FUNCIONARIOS
    watermark_order_by: ID_FUNCIONARIOS, ID_FILIAL
    full_refresh: true

  usuarios:
    enabled: true
    table: dbo.USUARIOS
    watermark_column: ID_USUARIOS
    watermark_order_by: ID_USUARIOS, ID_FILIAL
    full_refresh: true
    # Mantém o operador de caixa sincronizado para que TURNOS.ID_USUARIOS sempre encontre o cadastro.

  entidades:
    enabled: true
    table: dbo.ENTIDADES
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_WATERMARK
    watermark_overlap_seconds: 120
    query: |
      SELECT e.*,
             COALESCE(CAST(e.ULTALTERACAO AS datetime2), CAST(e.DTACADASTRO AS datetime2)) AS TORQMIND_WATERMARK
      FROM dbo.ENTIDADES e

  clientes:
    enabled: true
    table: dbo.ENTIDADES
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_WATERMARK
    watermark_overlap_seconds: 120
    query: |
      SELECT e.*,
             COALESCE(CAST(e.ULTALTERACAO AS datetime2), CAST(e.DTACADASTRO AS datetime2)) AS TORQMIND_WATERMARK
      FROM dbo.ENTIDADES e

  grupoprodutos:
    enabled: true
    table: dbo.GRUPOPRODUTOS
    watermark_column: ID_GRUPOPRODUTOS
    watermark_order_by: ID_GRUPOPRODUTOS, ID_FILIAL
    full_refresh: true

  localvendas:
    enabled: true
    table: dbo.LOCALVENDAS
    watermark_column: ID_LOCALVENDAS
    watermark_order_by: ID_LOCALVENDAS, ID_FILIAL
    full_refresh: true

  planodecontas:
    enabled: true
    table: dbo.PLANODECONTAS
    watermark_column: ID_PLANODECONTAS
    watermark_order_by: ID_PLANODECONTAS, ID_FILIAL
    full_refresh: true

  produtos:
    enabled: true
    table: dbo.PRODUTOS
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_WATERMARK
    watermark_overlap_seconds: 120
    query: |
      SELECT p.*,
             COALESCE(CAST(p.ULTALTERACAO AS datetime2), CAST(p.DATACADASTRO AS datetime2)) AS TORQMIND_WATERMARK
      FROM dbo.PRODUTOS p

  turnos:
    enabled: true
    table: dbo.TURNOS
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_order_by: TORQMIND_WATERMARK, ID_FILIAL, ID_TURNOS
    allow_zero_inserted_batches: true
    watermark_overlap_seconds: 120
    query: |
      SELECT t.*,
             CAST(t.DATA AS datetime2) AS TORQMIND_DT_EVENTO,
             (SELECT MAX(v.dt)
                FROM (VALUES
                    (CAST(t.DATA AS datetime2)),
                    (CAST(t.DATATURNO AS datetime2)),
                    (CAST(t.DATAFECHAMENTO AS datetime2))
                ) AS v(dt)) AS TORQMIND_WATERMARK
      FROM dbo.TURNOS t

  contaspagar:
    enabled: true
    table: dbo.CONTASPAGAR
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_overlap_seconds: 120
    query: |
      SELECT c.*,
             CAST(c.DTACONTA AS datetime2) AS TORQMIND_DT_EVENTO,
             (SELECT MAX(v.dt)
                FROM (VALUES
                    (CAST(c.DTACONTA AS datetime2)),
                    (CAST(c.DTAVCTO AS datetime2)),
                    (CAST(c.DTAPGTO AS datetime2)),
                    (CAST(c.DATAPROGRAMACAO AS datetime2)),
                    (CAST(c.API_DATE_TIME AS datetime2))
                ) AS v(dt)) AS TORQMIND_WATERMARK
      FROM dbo.CONTASPAGAR c

  contasreceber:
    enabled: true
    table: dbo.CONTASRECEBER
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_overlap_seconds: 120
    query: |
      SELECT c.*,
             CAST(c.DTACONTA AS datetime2) AS TORQMIND_DT_EVENTO,
             (SELECT MAX(v.dt)
                FROM (VALUES
                    (CAST(c.DTACONTA AS datetime2)),
                    (CAST(c.DTAVCTO AS datetime2)),
                    (CAST(c.DTAPGTO AS datetime2)),
                    (CAST(c.DTAFECHAMENTO AS datetime2))
                ) AS v(dt)) AS TORQMIND_WATERMARK
      FROM dbo.CONTASRECEBER c

  contasreceberbaixa:
    enabled: true
    table: dbo.CONTASRECEBERBAIXA
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_overlap_seconds: 120
    query: |
      SELECT c.*,
             CAST(c.DATABAIXA AS datetime2) AS TORQMIND_DT_EVENTO,
             CAST(c.DATAREPL AS datetime2) AS TORQMIND_WATERMARK
      FROM dbo.CONTASRECEBERBAIXA c

  contaspagarbaixa:
    enabled: true
    table: dbo.CONTASPAGARBAIXA
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_overlap_seconds: 120
    query: |
      SELECT c.*,
             CAST(c.DATABAIXA AS datetime2) AS TORQMIND_DT_EVENTO,
             CAST(c.DATAREPL AS datetime2) AS TORQMIND_WATERMARK
      FROM dbo.CONTASPAGARBAIXA c

  movlctos:
    enabled: true
    table: dbo.MOVLCTOS
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_overlap_seconds: 120
    retention_days: 365
    bootstrap_days: 365
    query: |
      SELECT m.*,
             CAST(m.DATA AS datetime2) AS TORQMIND_DT_EVENTO,
             CAST(m.DATAREPL AS datetime2) AS TORQMIND_WATERMARK
      FROM dbo.MOVLCTOS m

  financeiro: { enabled: false, table: dbo.FINANCEIRO }

  # NFE - Notas Fiscais Eletronicas
  # Filtro por DATA (data de emissao comercial).
  # NAO usa DATAREPL, NAO usa DATAEMISSAO, NAO exige SERIE.
  # STATUS=5 = inutilizacao (coletado para auditoria, ignorado comercialmente).
  nfe:
    enabled: true
    table: dbo.NFE
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_order_by: TORQMIND_WATERMARK, ID_FILIAL, ID_DB, ID_COMPROVANTE, ID_NFE
    cursor_pk_columns: [ID_FILIAL, ID_DB, ID_COMPROVANTE, ID_NFE]
    retention_days: 365
    bootstrap_days: 365
    watermark_overlap_seconds: 120
    query: |
      SELECT n.*,
             CAST(n.DATA AS datetime2) AS TORQMIND_DT_EVENTO,
             CAST(n.DATA AS datetime2) AS TORQMIND_WATERMARK
      FROM dbo.NFE n

  # Antifraude - troca de forma de pagamento.
  # CONTROLE_TROCA_PGTO = auditoria da troca (quem=USUARIO, quando=DATA),
  # aponta para o lancamento ANTIGO via ID_MOVLCTOSCANCELADOS.
  # ID_FILIAL como chave primaria padrao (cursor_pk_columns / watermark_order_by).
  controle_troca_pgto:
    enabled: true
    table: dbo.CONTROLE_TROCA_PGTO
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_order_by: TORQMIND_WATERMARK, ID_FILIAL, ID, ID_DB
    cursor_pk_columns: [ID_FILIAL, ID, ID_DB]
    bootstrap_days: 365
    watermark_overlap_seconds: 120
    query: |
      SELECT t.*,
             CAST(t.DATA AS datetime2) AS TORQMIND_DT_EVENTO,
             (SELECT MAX(v.dt)
                FROM (VALUES
                    (CAST(t.DATA AS datetime2)),
                    (NULLIF(CAST(t.DATAREPL AS datetime2), CAST('1900-01-01T00:00:00' AS datetime2)))
                ) AS v(dt)) AS TORQMIND_WATERMARK
      FROM dbo.CONTROLE_TROCA_PGTO t

  # Antifraude - lancamentos financeiros CANCELADOS (forma DE da troca).
  # A forma e a conta ID_PLANODECONTAS (-> PLANODECONTAS.NOMEPLANODECONTAS).
  # DTACONTA = data contabil; TIPO aqui e debito/credito, NAO tipo_forma da venda.
  movlctoscancelados:
    enabled: true
    table: dbo.MOVLCTOSCANCELADOS
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_order_by: TORQMIND_WATERMARK, ID_FILIAL, ID_MOVLCTOSCANCELADOS, ID_DB
    cursor_pk_columns: [ID_FILIAL, ID_MOVLCTOSCANCELADOS, ID_DB]
    bootstrap_days: 365
    watermark_overlap_seconds: 120
    query: |
      SELECT m.*,
             CAST(m.DTACONTA AS datetime2) AS TORQMIND_DT_EVENTO,
             (SELECT MAX(v.dt)
                FROM (VALUES
                    (CAST(m.DTACONTA AS datetime2)),
                    (NULLIF(CAST(m.DATAREPL AS datetime2), CAST('1900-01-01T00:00:00' AS datetime2)))
                ) AS v(dt)) AS TORQMIND_WATERMARK
      FROM dbo.MOVLCTOSCANCELADOS m

  # ------------------------------------------------------------------
  # Coletas novas (Solvencia/DRE + Financeiro + Antifraude + Vendas).
  # IMPORTANTE: estes datasets JA VEM EMBUTIDOS no binario (agent/config.py
  # DEFAULT_DATASETS). Ao gerar um novo .exe eles passam a coletar sozinhos —
  # voce NAO precisa copiar este mapeamento para o config do cliente. Estao
  # aqui apenas como referencia/documentacao.
  # ------------------------------------------------------------------

  # Estoque para Solvencia/DRE (sensor de tanque + loja).
  tanques:
    enabled: true
    table: dbo.TANQUES
    watermark_column: ID_TANQUES
    watermark_order_by: ID_TANQUES, ID_FILIAL
    full_refresh: true

  movtanques:
    enabled: true
    table: dbo.MOVTANQUES
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    bootstrap_days: 365
    watermark_overlap_seconds: 240
    query: |
      SELECT m.*, CAST(m.DTACONTA AS datetime2) AS TORQMIND_DT_EVENTO, CAST(m.DTACONTA AS datetime2) AS TORQMIND_WATERMARK FROM dbo.MOVTANQUES m

  estoque:
    enabled: true
    table: dbo.ESTOQUE
    watermark_column: ID_ESTOQUE
    watermark_order_by: ID_ESTOQUE, ID_FILIAL
    full_refresh: true

  # Financeiro: controle de cheques recebidos + catalogo de situacoes (motivos).
  cheques:
    enabled: true
    table: dbo.CHEQUESRECEBIDOS
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    bootstrap_days: 365
    watermark_overlap_seconds: 240
    revisit_open_clause: (DTACOMPENSADO IS NULL AND CAST(DTACONTA AS date) >= CAST(DATEADD(day,-180,GETDATE()) AS date)) OR (DTACOMPENSADO IS NOT NULL AND CAST(DTACOMPENSADO AS date) >= CAST(DATEADD(day,-120,GETDATE()) AS date))
    query: |
      SELECT c.*, CAST(c.DTACONTA AS datetime2) AS TORQMIND_DT_EVENTO, (SELECT MAX(v.dt) FROM (VALUES (CAST(c.DTACONTA AS datetime2)), (NULLIF(CAST(c.DATAREPL AS datetime2), CAST('1900-01-01T00:00:00' AS datetime2))), (CAST(c.DTACOMPENSADO AS datetime2))) AS v(dt)) AS TORQMIND_WATERMARK FROM dbo.CHEQUESRECEBIDOS c

  situacoes:
    enabled: true
    table: dbo.SITUACOES
    watermark_column: ID_SITUACOES
    watermark_order_by: ID_SITUACOES, ID_FILIAL
    full_refresh: true

  # Antifraude: lancamentos de credito de clientes (injecao/aplicacao) + saldo.
  movcreditoentidades:
    enabled: true
    table: dbo.MOVCREDITOENTIDADES
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    bootstrap_days: 365
    watermark_overlap_seconds: 240
    query: |
      SELECT m.*, CAST(m.DATA AS datetime2) AS TORQMIND_DT_EVENTO, (SELECT MAX(v.dt) FROM (VALUES (CAST(m.DATA AS datetime2)), (NULLIF(CAST(m.DATAREPL AS datetime2), CAST('1900-01-01T00:00:00' AS datetime2)))) AS v(dt)) AS TORQMIND_WATERMARK FROM dbo.MOVCREDITOENTIDADES m

  credito:
    enabled: true
    table: dbo.CREDITO
    watermark_column: ID_CREDITO
    watermark_order_by: ID_CREDITO, ID_FILIAL
    full_refresh: true

  # Vendas: abastecimentos do console da bomba (ticket medio de combustivel).
  consolearquivo:
    enabled: true
    table: dbo.CONSOLEARQUIVO
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    bootstrap_days: 365
    watermark_overlap_seconds: 240
    query: |
      SELECT c.*, CAST(c.DATA AS datetime2) AS TORQMIND_DT_EVENTO, (SELECT MAX(v.dt) FROM (VALUES (CAST(c.DATA AS datetime2)), (NULLIF(CAST(c.DATAREPL AS datetime2), CAST('1900-01-01T00:00:00' AS datetime2)))) AS v(dt)) AS TORQMIND_WATERMARK FROM dbo.CONSOLEARQUIVO c
