    revisit_open_clause: (NULLIF(CAST(DATAREPL AS datetime2), CAST('1900-01-01T00:00:00' AS datetime2)) >= DATEADD(day, -60,
      SYSUTCDATETIME()) OR ID_MOVLCTOSCANCELADOS >= 324000)
    query: SELECT m.*, CAST(m.DTACONTA AS datetime2) AS TORQMIND_DT_EVENTO, COALESCE(NULLIF(CAST(m.DATAREPL AS datetime2),
      CAST('1900-01-01T00:00:00' AS datetime2)), CASE WHEN CAST(m.DTACONTA AS datetime2) <= DATEADD(day, 1, SYSUTCDATETIME())      THEN
      CAST(m.DTACONTA AS datetime2) END) AS TORQMIND_WATERMARK FROM dbo.MOVLCTOSCANCELADOS m
