  nfe_entrada:
    enabled: true
    table: dbo.COMPROVANTES
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_order_by: TORQMIND_WATERMARK, ID_FILIAL, ID_DB, ID_COMPROVANTE
    cursor_pk_columns:
    - ID_FILIAL
    - ID_DB
    - ID_COMPROVANTE
    contract_name: nfe_entrada_pk
    required_fields:
    - ID_COMPROVANTE
    - ID_FILIAL
    - ID_DB
    unique_key_fields:
    - ID_FILIAL
    - ID_DB
    - ID_COMPROVANTE
    preflight_tables:
      dbo.COMPROVANTES:
      - ID_COMPROVANTE
      - ID_FILIAL
      - ID_DB
      - DATA
      - SAIDAS_ENTRADAS
      dbo.COMPENTRADAS:
      - ID_COMPROVANTE
      - ID_FILIAL
      - ID_DB
      - CHAVEACESSONFE
    bootstrap_days: 365
    watermark_overlap_seconds: 240
    query: SELECT c.ID_FILIAL, c.ID_DB, c.ID_COMPROVANTE AS ID_NOTA, c.ID_COMPROVANTE, c.NROCOMPROVANTE AS NUMERO, ce.CHAVEACESSONFE
      AS CHAVEACESSO, ce.CHAVEACESSONFE AS CHAVEACESSONFE, ce.VLRFRETE, ce.VLRIPI, ce.IMPORTOU_XML, ce.CONFERIDA, CAST(c.DATA
      AS datetime2) AS DATAENTRADA, CAST(COALESCE(c.DTAEMISSAO, c.DATA) AS datetime2) AS DATA, CAST(c.DATA AS datetime2) AS
      TORQMIND_DT_EVENTO, (SELECT MAX(v.dt) FROM (VALUES   (CAST(c.DATA AS datetime2)),   (NULLIF(CAST(c.DATAREPL AS datetime2),
      CAST('1900-01-01T00:00:00' AS datetime2))),   (NULLIF(CAST(ce.DATAREPL AS datetime2), CAST('1900-01-01T00:00:00' AS
      datetime2)))) AS v(dt)) AS TORQMIND_WATERMARK FROM dbo.COMPROVANTES c WITH (NOLOCK) INNER JOIN dbo.COMPENTRADAS ce WITH
      (NOLOCK)   ON ce.ID_FILIAL = c.ID_FILIAL AND ce.ID_DB = c.ID_DB  AND ce.ID_COMPROVANTE = c.ID_COMPROVANTE WHERE ISNULL(c.SAIDAS_ENTRADAS,
      0) = 1
  itens_nfe_entrada:
    enabled: true
    table: dbo.ITENSCOMPROVANTE
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_order_by: TORQMIND_WATERMARK, ID_FILIAL, ID_DB, ID_COMPROVANTE, ID_ITENSCOMPROVANTE
    cursor_pk_columns:
    - ID_FILIAL
    - ID_DB
    - ID_COMPROVANTE
    - ID_ITENSCOMPROVANTE
    contract_name: itens_nfe_entrada_pk
    required_fields:
    - ID_ITENSCOMPROVANTE
    - ID_COMPROVANTE
    - ID_FILIAL
    - ID_DB
    - ID_PRODUTOS
    unique_key_fields:
    - ID_FILIAL
    - ID_DB
    - ID_COMPROVANTE
    - ID_ITENSCOMPROVANTE
    preflight_tables:
      dbo.ITENSCOMPROVANTE:
      - ID_ITENSCOMPROVANTE
      - ID_FILIAL
      - ID_DB
      - ID_COMPROVANTE
      - ID_PRODUTOS
      - QTDE
      - VLRCUSTO
      - VLRUNITARIO
      dbo.COMPENTRADAS:
      - ID_COMPROVANTE
      - ID_FILIAL
      - ID_DB
      dbo.PRODUTOS:
      - ID_PRODUTOS
      - ID_FILIAL
      - TIPOCOMBUSTIVEL
      - NOMEPRODUTO
    bootstrap_days: 365
    watermark_overlap_seconds: 240
    query: SELECT i.ID_FILIAL, i.ID_DB, i.ID_COMPROVANTE AS ID_NOTA, i.ID_COMPROVANTE, i.ID_ITENSCOMPROVANTE AS ID_ITEM, i.ID_ITENSCOMPROVANTE,
      i.ID_PRODUTOS, i.QTDE AS QUANTIDADE, i.VLRCUSTO, i.VLRUNITARIO, i.VLRTOTALITEM, i.VLRVENDAENTRADA, COALESCE(NULLIF(i.VLRCUSTO,
      0), i.VLRUNITARIO) AS CUSTO_UNITARIO, p.NOMEPRODUTO, p.TIPOCOMBUSTIVEL, p.CODIGOANP, p.UNIDADE, CAST(c.DATA AS datetime2)
      AS TORQMIND_DT_EVENTO, (SELECT MAX(v.dt) FROM (VALUES   (CAST(c.DATA AS datetime2)),   (NULLIF(CAST(c.DATAREPL AS datetime2),
      CAST('1900-01-01T00:00:00' AS datetime2)))) AS v(dt)) AS TORQMIND_WATERMARK FROM dbo.ITENSCOMPROVANTE i WITH (NOLOCK)
      INNER JOIN dbo.COMPROVANTES c WITH (NOLOCK)   ON c.ID_FILIAL = i.ID_FILIAL AND c.ID_DB = i.ID_DB  AND c.ID_COMPROVANTE
      = i.ID_COMPROVANTE INNER JOIN dbo.COMPENTRADAS ce WITH (NOLOCK)   ON ce.ID_FILIAL = i.ID_FILIAL AND ce.ID_DB = i.ID_DB  AND
      ce.ID_COMPROVANTE = i.ID_COMPROVANTE INNER JOIN dbo.PRODUTOS p WITH (NOLOCK)   ON p.ID_FILIAL = i.ID_FILIAL AND p.ID_PRODUTOS
      = i.ID_PRODUTOS WHERE ISNULL(c.SAIDAS_ENTRADAS, 0) = 1   AND (    ISNULL(p.TIPOCOMBUSTIVEL, 0) > 0     OR (      NULLIF(LTRIM(RTRIM(CAST(p.CODIGOANP
      AS varchar(32)))), '') IS NOT NULL       AND UPPER(LTRIM(RTRIM(CAST(p.UNIDADE AS varchar(16))))) = 'LT'    )     OR
      p.NOMEPRODUTO LIKE 'GASOLINA%'     OR p.NOMEPRODUTO LIKE 'ETANOL%'     OR p.NOMEPRODUTO LIKE 'OLEO DIESEL%'     OR p.NOMEPRODUTO
      LIKE 'DIESEL%'  )
  preco_bomba_hist:
    enabled: true
    table: dbo.LMCBICOS
    watermark_column: TORQMIND_WATERMARK
    event_date_column: TORQMIND_DT_EVENTO
    watermark_order_by: TORQMIND_WATERMARK, ID_FILIAL, ID_LMCBICOS
    cursor_pk_columns:
    - ID_FILIAL
    - ID_LMCBICOS
    contract_name: preco_bomba_hist_pk
    required_fields:
    - ID_LMCBICOS
    - ID_FILIAL
    - ID_PRODUTOS
    - PPL
    unique_key_fields:
    - ID_FILIAL
    - ID_LMCBICOS
    preflight_tables:
      dbo.LMC:
      - ID_LMC
      - ID_FILIAL
      - ID_PRODUTOS
      - DTACONTA
      dbo.LMCBICOS:
      - ID_LMCBICOS
      - ID_FILIAL
      - ID_LMC
      - ID_BICOS
      - PPL
    bootstrap_days: 365
    watermark_overlap_seconds: 240
    query: SELECT   lb.ID_FILIAL,   CAST(0 AS int) AS ID_DB,   l.ID_PRODUTOS AS ID_PRODUTOS,   lb.ID_LMCBICOS AS ID_EVENTO,   lb.ID_LMCBICOS,   lb.ID_LMC,   lb.ID_BICOS,   lb.PPL
      AS PRECO,   lb.PPL AS PPL,   lb.VENDAS,   p.NOMEPRODUTO,   CAST(l.DTACONTA AS datetime2) AS DATAALTERACAO,   CAST(l.DTACONTA
      AS datetime2) AS TORQMIND_DT_EVENTO, (SELECT MAX(v.dt) FROM (VALUES   (CAST(l.DTACONTA AS datetime2)),   (NULLIF(CAST(l.DATAREPL
      AS datetime2), CAST('1900-01-01T00:00:00' AS datetime2))),   (NULLIF(CAST(lb.DATAREPL AS datetime2), CAST('1900-01-01T00:00:00'
      AS datetime2)))) AS v(dt)) AS TORQMIND_WATERMARK FROM dbo.LMCBICOS lb WITH (NOLOCK) INNER JOIN dbo.LMC l WITH (NOLOCK)   ON
      l.ID_FILIAL = lb.ID_FILIAL AND l.ID_LMC = lb.ID_LMC LEFT JOIN dbo.PRODUTOS p WITH (NOLOCK)   ON p.ID_FILIAL = l.ID_FILIAL
      AND p.ID_PRODUTOS = l.ID_PRODUTOS WHERE ISNULL(lb.PPL, 0) > 0
