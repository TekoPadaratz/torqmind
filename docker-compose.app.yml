services:
  api:
    build:
      context: ./apps/api
    container_name: torqmind-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_ROOT_PATH: ${APP_ROOT_PATH:-}
      PG_HOST: ${PG_HOST:-CHANGE_ME_PRIVATE_POSTGRES_HOST}
      PG_PORT: ${PG_PORT:-5432}
      PG_DATABASE: ${POSTGRES_DB:-TORQMIND}
      PG_USER: ${POSTGRES_USER:-postgres}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_STRONG_POSTGRES_PASSWORD}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:CHANGE_ME_STRONG_POSTGRES_PASSWORD@CHANGE_ME_PRIVATE_POSTGRES_HOST:5432/TORQMIND}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-CHANGE_ME_PRIVATE_ANALYTICS_HOST}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-torqmind_mart}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-torqmind}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-CHANGE_ME_STRONG_CLICKHOUSE_PASSWORD}
      USE_CLICKHOUSE: ${USE_CLICKHOUSE:-true}
      DUAL_READ_MODE: ${DUAL_READ_MODE:-false}
      USE_REALTIME_MARTS: ${USE_REALTIME_MARTS:-false}
      REALTIME_MARTS_SOURCE: ${REALTIME_MARTS_SOURCE:-stg}
      REALTIME_MARTS_DOMAINS: ${REALTIME_MARTS_DOMAINS:-dashboard,sales,cash,fraud,finance,payments}
      REALTIME_MARTS_FALLBACK: ${REALTIME_MARTS_FALLBACK:-false}
      REFRESH_LEGACY_PG_MARTS: ${REFRESH_LEGACY_PG_MARTS:-false}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-}
      APP_CORS_ORIGIN_REGEX: ${APP_CORS_ORIGIN_REGEX:-}
      API_JWT_SECRET: ${API_JWT_SECRET:-CHANGE_ME_STRONG_API_JWT_SECRET_AT_LEAST_32_CHARS}
      API_JWT_ISSUER: ${API_JWT_ISSUER:-torqmind-api}
      API_ACCESS_TOKEN_MINUTES: ${API_ACCESS_TOKEN_MINUTES:-60}
      INGEST_REQUIRE_KEY: ${INGEST_REQUIRE_KEY:-true}
      INGEST_BATCH_SIZE: ${INGEST_BATCH_SIZE:-5000}
      INGEST_RETENTION_OVERRIDE_DATASETS: ${INGEST_RETENTION_OVERRIDE_DATASETS:-comprovantes,movprodutos,itensmovprodutos,formas_pgto_comprovantes,turnos}
      PLATFORM_MASTER_EMAIL: ${PLATFORM_MASTER_EMAIL:-}
      PLATFORM_MASTER_PASSWORD: ${PLATFORM_MASTER_PASSWORD:-}
      PLATFORM_MASTER_NAME: ${PLATFORM_MASTER_NAME:-TorqMind Platform Master}
      CHANNEL_BOOTSTRAP_EMAIL: ${CHANNEL_BOOTSTRAP_EMAIL:-}
      CHANNEL_BOOTSTRAP_PASSWORD: ${CHANNEL_BOOTSTRAP_PASSWORD:-}
      CHANNEL_BOOTSTRAP_USER_NAME: ${CHANNEL_BOOTSTRAP_USER_NAME:-TorqMind Channel Admin}
      CHANNEL_BOOTSTRAP_NAME: ${CHANNEL_BOOTSTRAP_NAME:-Canal TorqMind}
      ETL_INTERNAL_KEY: ${ETL_INTERNAL_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      NOTIFY_MIN_SEVERITY: ${NOTIFY_MIN_SEVERITY:-CRITICAL}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JARVIS_MODEL_FAST: ${JARVIS_MODEL_FAST:-gpt-4.1-mini}
      JARVIS_MODEL_STRONG: ${JARVIS_MODEL_STRONG:-gpt-4.1}
      JARVIS_AI_TOP_N: ${JARVIS_AI_TOP_N:-10}
      JARVIS_AI_MAX_OUTPUT_TOKENS: ${JARVIS_AI_MAX_OUTPUT_TOKENS:-500}
      JARVIS_AI_TIMEOUT_SECONDS: ${JARVIS_AI_TIMEOUT_SECONDS:-30}
      JARVIS_AI_RPM_SLEEP_SECONDS: ${JARVIS_AI_RPM_SLEEP_SECONDS:-2}
      JARVIS_AI_INPUT_COST_PER_1M: ${JARVIS_AI_INPUT_COST_PER_1M:-0.4}
      JARVIS_AI_OUTPUT_COST_PER_1M: ${JARVIS_AI_OUTPUT_COST_PER_1M:-1.6}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-4}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-20}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      DB_POOL_MAX_IDLE_SECONDS: ${DB_POOL_MAX_IDLE_SECONDS:-300}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-America/Sao_Paulo}
      BUSINESS_TENANT_TIMEZONES: ${BUSINESS_TENANT_TIMEZONES:-}
      # Password reset ("esqueci minha senha")
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
      PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:-30}
      PASSWORD_RESET_LINK_PATH: ${PASSWORD_RESET_LINK_PATH:-/reset-password}
      # SMTP / e-mail transacional (recuperação de senha). Desligado por padrão.
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_FROM: ${SMTP_FROM:-master@torqmind.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-TorqMind}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-20}
    expose:
      - "8000"
    volumes:
      - ./sql/migrations:/app/sql/migrations:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 25s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    container_name: torqmind-web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
      NEXT_PUBLIC_BUSINESS_TIMEZONE: ${NEXT_PUBLIC_BUSINESS_TIMEZONE:-America/Sao_Paulo}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/ >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  nginx:
    image: nginx:stable-alpine
    container_name: torqmind-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_BIND_IP:-0.0.0.0}:${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 10s
